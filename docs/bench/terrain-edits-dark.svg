<svg xmlns="http://www.w3.org/2000/svg" width="760" height="268" viewBox="0 0 760 268" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="What a terrain change costs, voxel terrain against a triangle mesh">
<title>What a terrain change costs, voxel terrain against a triangle mesh</title>
<rect width="760" height="268" rx="8" fill="#1a1a19"/>
<text x="24.0" y="30.0" font-size="17" fill="#f0efec" text-anchor="start" font-weight="600">What a terrain change costs</text>
<text x="24.0" y="50.0" font-size="12.5" fill="#c3c2b7" text-anchor="start" font-weight="400">Median of 400; a voxel section is replaced about 95× faster than a mesh is rebuilt</text>
<line x1="24.0" y1="80" x2="24.0" y2="216" stroke="#2c2c2a" stroke-width="1"/>
<text x="24.0" y="234.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">0.1 µs</text>
<line x1="163.2" y1="80" x2="163.2" y2="216" stroke="#2c2c2a" stroke-width="1"/>
<text x="163.2" y="234.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">1 µs</text>
<line x1="302.4" y1="80" x2="302.4" y2="216" stroke="#2c2c2a" stroke-width="1"/>
<text x="302.4" y="234.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">10 µs</text>
<line x1="441.6" y1="80" x2="441.6" y2="216" stroke="#2c2c2a" stroke-width="1"/>
<text x="441.6" y="234.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">100 µs</text>
<line x1="580.8" y1="80" x2="580.8" y2="216" stroke="#2c2c2a" stroke-width="1"/>
<text x="580.8" y="234.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">1 ms</text>
<line x1="720.0" y1="80" x2="720.0" y2="216" stroke="#2c2c2a" stroke-width="1"/>
<text x="720.0" y="234.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">10 ms</text>
<text x="24.0" y="94.0" font-size="12.5" fill="#c3c2b7" text-anchor="start" font-weight="400">Edit one block</text>
<line x1="24.0" y1="108" x2="149.7" y2="108" stroke="#383835" stroke-width="1"/>
<circle cx="149.7" cy="108" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"><title>Edit one block: 0.8 µs</title></circle>
<text x="161.7" y="112.0" font-size="12.5" fill="#f0efec" text-anchor="start" font-weight="600">0.8 µs</text>
<text x="24.0" y="140.0" font-size="12.5" fill="#c3c2b7" text-anchor="start" font-weight="400">Replace a 16×16×16 section</text>
<line x1="24.0" y1="154" x2="274.5" y2="154" stroke="#383835" stroke-width="1"/>
<circle cx="274.5" cy="154" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"><title>Replace a 16×16×16 section: 6.3 µs</title></circle>
<text x="286.5" y="158.0" font-size="12.5" fill="#f0efec" text-anchor="start" font-weight="600">6.3 µs</text>
<text x="24.0" y="186.0" font-size="12.5" fill="#c3c2b7" text-anchor="start" font-weight="400">Rebuild that section as a triangle mesh (2,156 triangles)</text>
<line x1="24.0" y1="200" x2="549.5" y2="200" stroke="#383835" stroke-width="1"/>
<circle cx="549.5" cy="200" r="5" fill="#d95926" stroke="#1a1a19" stroke-width="2"><title>Rebuild that section as a triangle mesh (2,156 triangles): 595.6 µs</title></circle>
<text x="561.5" y="204.0" font-size="12.5" fill="#f0efec" text-anchor="start" font-weight="600">595.6 µs</text>
<line x1="460" y1="26" x2="478" y2="26" stroke="#3987e5" stroke-width="2" stroke-linecap="round"/>
<circle cx="469" cy="26" r="4" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<text x="484.0" y="30.0" font-size="13" fill="#c3c2b7" text-anchor="start" font-weight="400">voxel terrain</text>
<line x1="604.2" y1="26" x2="622.2" y2="26" stroke="#d95926" stroke-width="2" stroke-linecap="round"/>
<circle cx="613.2" cy="26" r="4" fill="#d95926" stroke="#1a1a19" stroke-width="2"/>
<text x="628.2" y="30.0" font-size="13" fill="#c3c2b7" text-anchor="start" font-weight="400">triangle mesh</text>
</svg>
