plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.181'
    id 'com.diffplug.spotless' version '7.2.1'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenLocal()
    mavenCentral()
}

// LDLib2 is for tests only — its multi-process harness (a real dedicated server and clients over localhost, below) is
// how the network sync is tested. MineBox3D does not depend on it: compileOnly keeps it out of the published POM, the
// jar leaves out the test package that names it, neoforge.mods.toml does not mention it, and only the dev runs carry it.
def ldlib2Test = "com.lowdragmc.ldlib2:ldlib2-neoforge-${minecraft_version}:${ldlib2_version}:all"

configurations {
    // on the runs (whose classpath is runtimeClasspath, where a mod jar is found as a mod), not in what is published
    // (runtimeElements, which takes implementation and runtimeOnly only)
    ldlib2Runtime {
        canBeConsumed = false
    }
    runtimeClasspath.extendsFrom(ldlib2Runtime)
    // the multi-process orchestrator's own short classpath (runMpTest below)
    ldlib2Orchestrator {
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    compileOnly ldlib2Test
    ldlib2Runtime ldlib2Test
    ldlib2Orchestrator ldlib2Test

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.0'
}

// =================================================================================================
// The native library
//
// native/box3d is the Box3D git submodule; native/src is the JNI bridge. CMake builds the two into
// one shared library for the platform Gradle runs on, which lands in the jar at
// natives/minebox3d/<os>-<arch>/<library>. A release jar carries every platform: CI builds each one on
// its own runner and hands the folder in with -Pminebox3d.natives=<dir> (see .github/workflows).
// =================================================================================================

static String nativeOs() {
    String os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    if (os.contains('win')) return 'windows'
    if (os.contains('mac') || os.contains('darwin')) return 'macos'
    return 'linux'
}

static String nativeArch() {
    String arch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
    if (arch in ['amd64', 'x86_64', 'x64']) return 'x86_64'
    if (arch in ['aarch64', 'arm64']) return 'aarch64'
    return arch
}

static String nativeFileName(String os) {
    return os == 'windows' ? 'minebox3d.dll' : os == 'macos' ? 'libminebox3d.dylib' : 'libminebox3d.so'
}

def nativePlatform = "${nativeOs()}-${nativeArch()}"
def nativeCmakeDir = layout.buildDirectory.dir('native/cmake')
def nativeOutDir = layout.buildDirectory.dir("native/out/${nativePlatform}")
def nativeResourcesDir = layout.buildDirectory.dir('native/resources')
def nativeLibraryFile = nativeOutDir.map { it.file(nativeFileName(nativeOs())) }

// A tool: -P<property>=<path>, else PATH, else the copy Visual Studio ships (found with vswhere), else null.
def findTool = { String property, String name, String visualStudioPath ->
    if (project.hasProperty(property)) return project.property(property).toString()
    String exe = nativeOs() == 'windows' ? "${name}.exe" : name
    for (String dir : (System.getenv('PATH') ?: '').split(File.pathSeparator)) {
        File candidate = new File(dir, exe)
        if (candidate.isFile()) return candidate.absolutePath
    }
    if (nativeOs() == 'windows') {
        File vswhere = new File(System.getenv('ProgramFiles(x86)') ?: 'C:/Program Files (x86)',
                'Microsoft Visual Studio/Installer/vswhere.exe')
        if (vswhere.isFile()) {
            def process = [vswhere.absolutePath, '-latest', '-products', '*', '-property', 'installationPath'].execute()
            File bundled = new File(process.text.trim(), visualStudioPath)
            if (bundled.isFile()) return bundled.absolutePath
        }
    }
    return null
}
def cmakeExecutable = findTool('minebox3d.cmake', 'cmake',
        'Common7/IDE/CommonExtensions/Microsoft/CMake/CMake/bin/cmake.exe')

// Box3D is our fork's `minebox3d` branch (Low-Drag-MC/box3d), built straight from the submodule;
// what the fork changes and why is docs/design/02-box3d-fork.md.
def jdkHome = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
        .map { it.metadata.installationPath.asFile.absolutePath }

tasks.register('configureNative', Exec) {
    group = 'native'
    description = 'Configures the Box3D JNI library for this platform.'
    inputs.file('native/CMakeLists.txt')
    // ⚠️ the sources too: CMake globs them, and a file added after the last configure is only picked up
    // by a configure. Its CONFIGURE_DEPENDS check regenerates the project mid-build, too late for that
    // build, which then produces a library without the new file's functions — and Gradle calls it done.
    inputs.dir('native/src')
    inputs.file('native/box3d/CMakeLists.txt')
    inputs.file('native/box3d/src/CMakeLists.txt')
    outputs.dir(nativeCmakeDir)
    doFirst {
        if (cmakeExecutable == null) {
            throw new GradleException('CMake not found: put it on PATH, install Visual Studio with C++ tools, or pass -Pminebox3d.cmake=<path>')
        }
        if (!file('native/box3d/CMakeLists.txt').isFile()) {
            throw new GradleException('native/box3d is empty: run `git submodule update --init`')
        }
    }
    def args = [cmakeExecutable ?: 'cmake', '-S', file('native').absolutePath, '-B', nativeCmakeDir.get().asFile.absolutePath,
                "-DMB3_JNI_INCLUDE=${jdkHome.get()}/include",
                "-DMB3_OUTPUT_DIR=${nativeOutDir.get().asFile.absolutePath}",
                '-DCMAKE_BUILD_TYPE=RelWithDebInfo']
    if (nativeOs() == 'windows') {
        args += ['-G', 'Visual Studio 17 2022', '-A', nativeArch() == 'aarch64' ? 'ARM64' : 'x64']
    }
    commandLine args
}

tasks.register('buildNative', Exec) {
    group = 'native'
    description = 'Builds the Box3D JNI library for this platform.'
    dependsOn 'configureNative'
    inputs.dir('native/src')
    inputs.dir('native/box3d/src')
    inputs.dir('native/box3d/include')
    // ⚠️ and what configures it: a compile definition changed in a CMakeLists reconfigures, and without this the build
    // that should follow was skipped as up to date
    inputs.file('native/CMakeLists.txt')
    inputs.file('native/box3d/CMakeLists.txt')
    inputs.file('native/box3d/src/CMakeLists.txt')
    outputs.file(nativeLibraryFile)
    commandLine cmakeExecutable ?: 'cmake', '--build', nativeCmakeDir.get().asFile.absolutePath,
            '--config', 'RelWithDebInfo', '--target', 'minebox3d', '--parallel'
}

tasks.register('collectNatives', Sync) {
    group = 'native'
    description = 'Lays the native libraries out the way the jar carries them.'
    into nativeResourcesDir.map { it.dir('natives/minebox3d') }
    if (project.hasProperty('minebox3d.natives')) {
        // a release: every platform, built elsewhere, as <dir>/<os>-<arch>/<library>
        from(project.property('minebox3d.natives').toString())
    } else {
        dependsOn 'buildNative'
        from(nativeLibraryFile) { into nativePlatform }
    }
}

sourceSets.main.resources.srcDir(nativeResourcesDir)
tasks.named('processResources') { dependsOn 'collectNatives' }
tasks.named('sourcesJar') { dependsOn 'collectNatives' }

// Dev runs and tests load the freshly built file directly instead of the copy inside the jar.
def nativeLibraryPath = nativeLibraryFile.map { it.asFile.absolutePath }

// =================================================================================================

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        systemProperty 'minebox3d.native.path', nativeLibraryPath.get()
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        systemProperty 'minebox3d.native.path', nativeLibraryPath.get()
        programArgument '--nogui'
    }

    // ⚠️ No minebox3d.native.path here, on purpose: the GameTest server finds the library the way a
    // player's game does — as a resource of the mod, copied out and loaded — so the one path that
    // only exists inside Minecraft's module layers is the one the tests cross.
    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

// ./gradlew mb3Setup: the git hooks and blame settings for a fresh clone or worktree.
apply from: rootProject.file('gradle/dev-setup.gradle')

// LDLib2's test harnesses (tests only, see ldlib2Test). The multi-process one adds runMpServer / runMpClientA /
// runMpClientB and must come after the `runs { }` block:
//
//   ./gradlew runMpTest -PldMpTest=group:minebox3d -PldTestHeadless
//
// ⚠️ -PldTestHeadless, always: without it the clients open windows, and a run left without a display is a run that
// reports green having tested nothing (EntityStudio learnt this the hard way).
apply from: rootProject.file('gradle/ldlib2-uitest.gradle')
apply from: rootProject.file('gradle/ldlib2-mptest.gradle')

// The vendored script finds the orchestrator on the runtime classpath, where a mod that depends on LDLib2 has it; here
// LDLib2 is on the runs only, so it is given its own two entries: LDLib2's jar and gson.
tasks.named('runMpTest') {
    classpath = files(configurations.ldlib2Orchestrator,
            configurations.runtimeClasspath.filter { it.name.contains('gson') })
}

tasks.matching { it.name in ['runClient', 'runServer', 'runGameTestServer', 'runData', 'runMpServer', 'runMpClientA',
                             'runMpClientB'] }.configureEach {
    dependsOn 'buildNative'
}

// the server console reads commands from this process's stdin: `printf 'cmd\nstop\n' | ./gradlew runServer`
tasks.matching { it.name == 'runServer' }.configureEach {
    standardInput = System.in
}

// GameTests live in the main source set because NeoForge only scans that one for @GameTestHolder;
// nothing outside the package refers to them, so the shipped jar simply leaves them out.
tasks.withType(Jar).configureEach {
    if (name == 'jar') {
        exclude 'com/lowdragmc/minebox3d/test/**'
    }
}

test {
    useJUnitPlatform()
    dependsOn 'buildNative'
    systemProperty 'minebox3d.native.path', nativeLibraryPath.get()
    // the library the tests load: a change to the C side alone runs them again
    inputs.file(nativeLibraryFile).withPathSensitivity(PathSensitivity.NONE).withPropertyName('nativeLibrary')
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            "minecraft_version"      : minecraft_version,
            "minecraft_version_range": minecraft_version_range,
            "neo_version_range"      : neo_version_range,
            "loader_version_range"   : loader_version_range,
            "mod_id"                 : mod_id,
            "mod_name"               : mod_name,
            "mod_license"            : mod_license,
            "mod_version"            : mod_version,
            "mod_authors"            : mod_authors,
            "mod_description"        : mod_description,
            "mod_url"                : mod_url,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// =================================================================================================
// Formatting
//
// `spotlessApply` rewrites, `spotlessCheck` (part of `check`) fails on unformatted code. Java with
// palantir-java-format; the bridge's C (native/src) with clang-format in Box3D's own style
// (native/.clang-format), where one is found. Box3D is upstream's code and stays as upstream has it.
// The pre-commit hook (.githooks, installed by ./gradlew mb3Setup) passes -PformatFiles=<path,...>,
// relative to the project, to check only the staged files.
// =================================================================================================

def clangFormatExecutable = findTool('minebox3d.clangFormat', 'clang-format', 'VC/Tools/Llvm/x64/bin/clang-format.exe')

def formatFiles = (findProperty('formatFiles') ?: '').toString().tokenize(',')

spotless {
    java {
        target(formatFiles ? formatFiles.findAll { it.endsWith('.java') } : 'src/*/java/**/*.java')
        palantirJavaFormat()
        trimTrailingWhitespace()
        endWithNewline()
    }
    if (clangFormatExecutable != null) {
        // native/src is formatted by clang-format 19; other versions differ, and the style file needs 19
        def version = ([clangFormatExecutable, '--version'].execute().text =~ /version (\S+)/)
        if (version.find() && version.group(1).startsWith('19.')) {
            cpp {
                target(formatFiles ? formatFiles.findAll { it ==~ /native\/src\/[^\/]+\.[ch]/ }
                        : ['native/src/**/*.c', 'native/src/**/*.h'])
                // the code goes in on stdin, where clang-format would not find the file beside it
                clangFormat(version.group(1)).pathToExe(clangFormatExecutable)
                        .style("file:${file('native/.clang-format').absolutePath}")
            }
        }
    }
}
// Spotless keys the C step on the style file's path, not its content
tasks.matching { it.name.startsWith('spotlessCpp') }.configureEach {
    inputs.file('native/.clang-format').withPathSensitivity(PathSensitivity.NONE).withPropertyName('clangFormatStyle')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
