name: Build

# Every push and pull request builds the native library for each platform, tests it where it runs, and packs one jar
# that carries all of them. Publishing to Maven is a manual run (Actions → Build → Run workflow → publish, and the
# version).

on:
  push:
    branches: [main, release-prep]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the jar to Maven
        type: boolean
        default: false
      version:
        description: The version to publish, e.g. 0.4.0 (empty for gradle.properties' mod_version)
        type: string
        default: ''

env:
  JAVA_VERSION: '21'

jobs:
  natives:
    name: Native ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-2025
            cmake-args: -A x64
            library: minebox3d.dll
            c-tests: true
          # manylinux_2_28: built against glibc 2.28, so the library loads on any distribution from 2018 on
          # and keeps pthreads in libpthread, which Box3D's test build does not link
          - platform: linux-x86_64
            runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            library: libminebox3d.so
            c-tests: true
            c-test-args: -DCMAKE_EXE_LINKER_FLAGS=-pthread
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            library: libminebox3d.so
            c-tests: true
            c-test-args: -DCMAKE_EXE_LINKER_FLAGS=-pthread
          - platform: macos-aarch64
            runner: macos-15
            cmake-args: -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
            library: libminebox3d.dylib
            c-tests: true
          # cross-compiled on the arm64 runner: nothing here runs it, its JUnit run is the job below on Intel
          - platform: macos-x86_64
            runner: macos-15
            cmake-args: -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
            library: libminebox3d.dylib
            c-tests: false
    steps:
      - name: Install git and the JDK headers (manylinux)
        if: matrix.container
        run: dnf install -y git java-21-openjdk-devel

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # the Box3D fork is a submodule of its own repository: a token that can read it, if it is private
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - uses: actions/setup-java@v4
        if: ${{ !matrix.container }}
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Build the library
        shell: bash
        run: |
          if [ -z "$JAVA_HOME" ]; then
            JAVA_HOME=$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")
          fi
          cmake -S native -B build/native/cmake ${{ matrix.cmake-args }} \
            "-DMB3_JNI_INCLUDE=$JAVA_HOME/include" \
            "-DMB3_OUTPUT_DIR=$PWD/natives/${{ matrix.platform }}" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build/native/cmake --config RelWithDebInfo --target minebox3d --parallel

      # the symbols go to an artifact of their own: MSVC's beside the DLL, elsewhere the unstripped library
      - name: Keep the symbols, ship the library alone
        shell: bash
        run: |
          mkdir -p symbols/${{ matrix.platform }}
          cd natives/${{ matrix.platform }}
          if [ "$RUNNER_OS" = Windows ]; then
            mv ./*.pdb ../../symbols/${{ matrix.platform }}/
          else
            cp ${{ matrix.library }} ../../symbols/${{ matrix.platform }}/
            if [ "$RUNNER_OS" = macOS ]; then strip -x ${{ matrix.library }}; else strip --strip-debug ${{ matrix.library }}; fi
          fi
          if [ "$(ls -A)" != "${{ matrix.library }}" ]; then
            echo "::error::more than the library to ship: $(ls -A)"; exit 1
          fi

      # the library names every library it needs: nothing left for the process that loads it to have brought in
      - name: Every symbol resolves
        if: runner.os == 'Linux'
        run: |
          out=$(ldd -r natives/${{ matrix.platform }}/${{ matrix.library }} 2>&1) || true
          echo "$out"
          if echo "$out" | grep -q 'undefined symbol'; then
            echo "::error::symbols the library does not say where to find"; exit 1
          fi

      - name: Box3D unit tests
        if: matrix.c-tests
        shell: bash
        run: |
          cmake -S native/box3d -B build/box3d-tests ${{ matrix.cmake-args }} ${{ matrix.c-test-args }} \
            -DBOX3D_SAMPLES=OFF -DBOX3D_UNIT_TESTS=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build/box3d-tests --config RelWithDebInfo --target test --parallel
          mkdir -p build/box3d-tests/run && cd build/box3d-tests/run
          test_exe=$(find .. -type f \( -name test -o -name test.exe \) -path '*bin*' | head -n 1)
          "$test_exe"

      - uses: actions/upload-artifact@v4
        with:
          name: natives-${{ matrix.platform }}
          path: natives/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: symbols-${{ matrix.platform }}
          path: symbols/

  test:
    name: JUnit ${{ matrix.platform }}
    needs: natives
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-2025
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: macos-aarch64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: natives-${{ matrix.platform }}
          path: natives/
      - name: JUnit
        shell: bash
        run: ./gradlew test "-Pminebox3d.natives=$PWD/natives" --stacktrace
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports-${{ matrix.platform }}
          path: build/reports/tests/

  build:
    name: Jar, checks and GameTests
    needs: natives
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: natives-*
          path: natives/
          merge-multiple: true

      - name: Every platform is there
        run: |
          for platform in windows-x86_64 linux-x86_64 linux-aarch64 macos-aarch64 macos-x86_64; do
            ls natives/$platform/* || { echo "::error::no native library for $platform"; exit 1; }
          done

      # the bridge's C is checked with clang-format 19 only, the version its style file is written for
      - name: clang-format 19
        run: sudo apt-get update && sudo apt-get install -y clang-format-19

      - name: Build, format check, JUnit
        run: >
          ./gradlew build "-Pminebox3d.natives=$PWD/natives"
          -Pminebox3d.clangFormat=/usr/bin/clang-format-19 --stacktrace

      - name: The jar carries every platform and the notices
        run: |
          jar=$(ls build/libs/minebox3d-*.jar | grep -v sources)
          unzip -l "$jar" | tee jar-contents.txt
          test "$(grep -c 'natives/minebox3d/.*/.*minebox3d\.' jar-contents.txt)" -eq 5
          grep -q LICENSE_minebox3d jar-contents.txt
          grep -q THIRD_PARTY_NOTICES_minebox3d.md jar-contents.txt

      - name: GameTests
        run: ./gradlew runGameTestServer "-Pminebox3d.natives=$PWD/natives" --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: build/libs/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-reports
          path: |
            build/reports/
            runs/gameTestServer/logs/

  publish:
    name: Publish to Maven
    needs: [test, build]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: natives-*
          path: natives/
          merge-multiple: true
      - name: Publish
        env:
          VERSION: ${{ inputs.version }}
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASS: ${{ secrets.MAVEN_PASS }}
        run: |
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2)
          fi
          if ! [[ "$VERSION" =~ ^[0-9A-Za-z.+-]+$ ]]; then
            echo "::error::not a version: '$VERSION'"; exit 1
          fi
          if [ -z "$MAVEN_USER" ] || [ -z "$MAVEN_PASS" ]; then
            echo "::error::the MAVEN_USER and MAVEN_PASS secrets are not set"; exit 1
          fi
          ./gradlew publish "-Pminebox3d.natives=$PWD/natives" "-Pmod_version=$VERSION" -x test --stacktrace
          echo "Published com.lowdragmc.minebox3d:minebox3d-1.21.1:$VERSION" >> "$GITHUB_STEP_SUMMARY"
